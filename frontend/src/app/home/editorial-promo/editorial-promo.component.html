<section class="container mx-auto px-4 sm:px-6 lg:px-8 py-20 relative z-10">
    <div class="bg-dark-900 overflow-hidden rounded-3xl border border-dark-800 shadow-2xl">
        <div class="grid grid-cols-1 lg:grid-cols-2 lg:gap-8 min-h-[65vh]">

            <!-- LEFT SIDE: Typography and Call to Action -->
            <div class="px-8 py-16 sm:px-16 lg:py-24 flex flex-col justify-center relative z-20">

                <span class="text-gray-400 font-medium text-xl mb-4">
                    Our Collections
                </span>

                <h2 class="text-4xl sm:text-5xl lg:text-6xl font-bold mb-6 leading-[1.1] tracking-tight relative z-10"
                    style="perspective: 1200px;">
                    <div style="transform-style: preserve-3d;">
                        <span appScrollAnimation animation="cinematic-3d"
                            class="inline-block text-white uppercase tracking-wider" style="animation-fill-mode: both;">
                            The SweatShirts
                        </span>
                    </div>
                    <div class="mt-2" style="transform-style: preserve-3d;">
                        <span appScrollAnimation animation="cinematic-3d" [delay]="400"
                            class="inline-block text-primary-400" style="animation-fill-mode: both;">
                            You'll Use Again <br> And Again.
                        </span>
                    </div>
                </h2>

                <p appScrollAnimation animation="ethereal-sweep" [delay]="800"
                    class="text-lg mb-10 max-w-md leading-relaxed font-light" style="animation-fill-mode: both;">
                    Upgrade your wardrobe with a variety of styles and fits that blend comfort with modern fashion.
                </p>

                <div class="flex">
                    <a routerLink="/products"
                        class="btn-primary-outline inline-flex items-center px-10 py-3.5 text-sm font-bold transition-all">
                        Shop All Products
                    </a>
                </div>

                <!-- Carousel Pagination Dots -->
                <div class="flex gap-4 mt-16 items-center">
                    <span class="w-2.5 h-2.5 rounded-full bg-white"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-gray-700"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-gray-700"></span>
                </div>

            </div>

            <!-- RIGHT SIDE: Visual Showcase matching reference layout -->
            <div
                class="relative bg-white/5 flex items-center justify-center p-8 lg:p-16 border-l border-dark-800 overflow-visible lg:overflow-hidden editorial-images-wrapper">

                <!-- Main Model Container -->
                <div
                    class="relative w-full max-w-sm ml-auto mr-8 lg:mr-16 bg-white/95 rounded-2xl shadow-2xl p-4 transform translate-x-4 lg:-translate-x-8">
                    <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&q=80"
                        alt="Fashion Model Background"
                        class="w-full h-auto object-cover rounded-xl shadow-inner border border-gray-100">

                    <!-- Floating Green Polo Product Card -->
                    <div
                        class="absolute -left-16 sm:-left-32 lg:-left-40 top-[60%] -translate-y-1/2 z-30 pointer-events-none">
                        <div class="product-showcase-card shadow-xl animate-float">
                            <div
                                class="bg-white rounded-xl p-6 sm:p-8 w-48 sm:w-64 h-auto border border-gray-100/50 shadow-2xl">
                                <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=600&q=80"
                                    alt="Green Polo Shirt" class="w-full h-full object-contain drop-shadow-md">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</section>
